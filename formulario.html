<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>
</head>

<body>
    
    <div> 
        
        <h1>Cadastro de DEVs</h1>
        <p>Complete suas informações</p>

    </div>

    <form> 

        <fieldset>
            <div>
                <label>Nome</label>
                <input type="text" name="nome" id="nome">
            </div>

            <div>
                <label>Sobrenome</label>
                <input type="text" name="sobrenome" id="sobrenome">
            </div>
        </fieldset>

        <div>
            <label>Email</label>
            <input type="email" name="email" id="email" placeholder="123@gmail.com" required>
        </div>

        <div>
            <label>Gênero:</label>
            <br>
            <label>
                <input type="radio" name="gênero" value="Homem">Homem
            </label>
            <br>
            <label>
                <input type="radio" name="gênero" value="Mulher">Mulher
            </label>
             <br>
            <label>
                <input type="radio" name="gênero" value="gay">Prefiro não identificar
            </label>
        </div>

    </form>

</body>
</html>
